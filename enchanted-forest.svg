<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#020d0e"/><stop offset=".38" stop-color="#09272b"/><stop offset=".68" stop-color="#0a3029"/><stop offset="1" stop-color="#031514"/></linearGradient>
 <radialGradient id="mist"><stop stop-color="#69e8d5" stop-opacity=".42"/><stop offset=".55" stop-color="#2ebc9b" stop-opacity=".12"/><stop offset="1" stop-color="#2ebc9b" stop-opacity="0"/></radialGradient>
 <linearGradient id="waterfall" x2="0" y2="1"><stop stop-color="#83fff4" stop-opacity=".04"/><stop offset=".5" stop-color="#8efff1" stop-opacity=".55"/><stop offset="1" stop-color="#3ee9cb" stop-opacity=".02"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#104b43" stop-opacity=".8"/><stop offset="1" stop-color="#020d0d"/></linearGradient>
 <linearGradient id="bark" x2="1" y2="0"><stop stop-color="#020909"/><stop offset=".5" stop-color="#0a241b"/><stop offset="1" stop-color="#061515"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff9ae"/><stop offset=".45" stop-color="#ffc75b"/><stop offset="1" stop-color="#b56a20"/></linearGradient>
